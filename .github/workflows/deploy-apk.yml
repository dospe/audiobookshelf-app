name: Publish Test App

# Builds the debug APK of master and attaches it to the pre-release tagged
# "latest", recreating the release every time so it always carries exactly
# one APK built from the current master. Releases (unlike workflow
# artifacts) are shown in the GitHub mobile app and the APK downloads
# directly from there.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'ios/**'
      - 'readme.md'

permissions:
  contents: write

concurrency:
  group: publish-test-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@v3

      - name: use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: 21

      - name: install dependencies
        run: npm ci

      - name: build Nuxt project
        run: npm run generate

      - name: copy to Android project
        run: npx cap sync

      - name: build Android app
        run: ./android/gradlew assembleDebug -p android --no-daemon

      - name: rename apk
        working-directory: android/app/build/outputs/apk/debug/
        run: |
          build="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          name="audiobookshelf-${build}.apk"
          mv -v app-debug.apk "${name}"

      - name: publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(ls android/app/build/outputs/apk/debug/*.apk)"
          short_sha="$(git rev-parse --short HEAD)"
          built_at="$(date -u '+%Y-%m-%d %H:%M UTC')"
          notes="Debug build of \`master\` at ${short_sha}, built ${built_at}.

          Download the APK below and install it on the phone (allow installs from unknown sources when asked). Android only."

          # Recreate the release so the "latest" tag moves to this commit and
          # only the current APK stays attached
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${apk}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Latest test build (${short_sha})" \
            --notes "${notes}"
